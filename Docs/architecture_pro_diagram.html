<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AutoChat Hub – Professional Architecture (made by mezzonuts)</title>
<style>
  body{font-family:'JetBrains Mono',monospace;background:#020617;color:#e2e8f0;margin:0;padding:0;}
  .container{max-width:1200px;margin:auto;padding:2rem;}
  h1{font-size:1.8rem;color:#22d3ee;margin-bottom:1rem;display:flex;align-items:center;}
  h1 .dot{width:10px;height:10px;border-radius:50%;background:#22d3ee;margin-left:0.5rem;animation:pulse 2s infinite;}
  @keyframes pulse{0%{opacity:1;}50%{opacity:0.3;}100%{opacity:1;}}
  h2{font-size:1.4rem;color:#34d399;margin-top:2rem;}
  .diagram{background:#0f172a;padding:1rem;margin-top:1rem;border-radius:8px;position:relative;border:1px solid #1e293b;}
  .legend{display:flex;flex-wrap:wrap;gap:1rem;margin-top:1rem;}
  .legend-item{display:flex;align-items:center;}
  .legend-swatch{width:16px;height:16px;margin-right:4px;border:1px solid;}
  .remark{font-size:0.8rem;color:#94a3b8;margin-top:0.4rem;text-align:right;}
  svg{width:100%;height:auto;}
  .arrow{stroke:#34d399;stroke-width:1.5;fill:none;marker-end:url(#arrowhead);}
  .box{fill:rgba(6,78,59,0.4);stroke:#34d399;stroke-width:1.5;rx:6;}
  .box-f{fill:rgba(8,51,68,0.4);stroke:#22d3ee;stroke-width:1.5;rx:6;}
  .box-db{fill:rgba(76,29,149,0.4);stroke:#a78bfa;stroke-width:1.5;rx:6;}
  .box-cloud{fill:rgba(120,53,15,0.3);stroke:#fbbf24;stroke-width:1.5;rx:6;}
  .box-sec{fill:rgba(136,19,55,0.4);stroke:#fb7185;stroke-width:1.5;rx:6;}
  .box-bus{fill:rgba(251,146,60,0.3);stroke:#fb923c;stroke-width:1.5;rx:6;}
  text{font-size:9px;fill:#e2e8f0;pointer-events:none;}
</style>
</head>
<body>
<div class="container">
<h1>AutoChat Hub Architecture <span class="dot"></span></h1>
<h2>Professional Cloud‑Native Diagram</h2>
<div class="diagram">
<svg viewBox="0 0 1000 560">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#34d399"/>
    </marker>
  </defs>
  <!-- VPC -->
  <rect x="30" y="20" width="940" height="520" rx="12" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="40" y="38" font-size="11" fill="#fbbf24">VPC (us‑east‑1)</text>
  <!-- Subnets -->
  <rect x="40" y="50" width="440" height="200" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="50" y="68" font-size="10" fill="#a78bfa">Public Subnet</text>
  <rect x="500" y="50" width="440" height="200" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="510" y="68" font-size="10" fill="#a78bfa">Private Subnet</text>
  <!-- Security Group -->
  <rect x="120" y="100" width="300" height="100" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="130" y="118" font-size="9" fill="#fb7185">Security Group – API</text>
  <!-- Components -->
  <rect x="150" y="140" width="140" height="60" class="box-f"/>
  <text x="160" y="170" font-size="9">Load Balancer (ELB)</text>
  <rect x="340" y="140" width="200" height="60" class="box-f"/>
  <text x="350" y="170" font-size="9">API Service (Next.js)</text>
  <rect x="580" y="140" width="180" height="60" class="box-f"/>
  <text x="590" y="170" font-size="9">Auth Service (Supabase)</text>
  <rect x="340" y="260" width="200" height="60" class="box"/>
  <text x="350" y="290" font-size="9">Backend Service (Node.js)</text>
  <rect x="580" y="260" width="180" height="60" class="box-bus"/>
  <text x="590" y="290" font-size="9">Message Bus (Redis/Upstash)</text>
  <rect x="340" y="380" width="200" height="60" class="box-db"/>
  <text x="350" y="410" font-size="9">PostgreSQL (Supabase)</text>
  <rect x="580" y="380" width="180" height="60" class="box-f"/>
  <text x="590" y="410" font-size="9">Monitoring (Grafana)</text>
  <rect x="40" y="300" width="120" height="60" class="box-cloud"/>
  <text x="50" y="330" font-size="9">CI / CD (GitHub Actions)</text>
  <rect x="40" y="380" width="120" height="60" class="box-cloud"/>
  <text x="50" y="410" font-size="9">IAM – Service Roles</text>
  <!-- Arrows -->
  <line x1="10" y1="70" x2="150" y2="170" class="arrow"/>
  <line x1="290" y1="170" x2="340" y2="170" class="arrow"/>
  <line x1="540" y1="170" x2="580" y2="170" class="arrow"/>
  <line x1="440" y1="200" x2="440" y2="260" class="arrow"/>
  <line x1="540" y1="290" x2="580" y2="290" class="arrow"/>
  <line x1="440" y1="320" x2="440" y2="380" class="arrow"/>
  <line x1="680" y1="320" x2="680" y2="380" class="arrow"/>
  <line x1="440" y1="440" x2="590" y2="410" class="arrow"/>
  <line x1="160" y1="330" x2="340" y2="170" class="arrow"/>
  <line x1="160" y1="410" x2="340" y2="290" class="arrow"/>
</svg>
<div class="remark">made by mezzonuts</div>
</div>

<h2>Diagram Legend</h2>
<div class="legend">
  <div class="legend-item"><div class="legend-swatch" style="background:rgba(8,51,68,0.4);border-color:#22d3ee;"></div><span>Frontend / API (Cyan)</span></div>
  <div class="legend-item"><div class="legend-swatch" style="background:rgba(6,78,59,0.4);border-color:#34d399;"></div><span>Backend (Emerald)</span></div>
  <div class="legend-item"><div class="legend-swatch" style="background:rgba(76,29,149,0.4);border-color:#a78bfa;"></div><span>Database (Violet)</span></div>
  <div class="legend-item"><div class="legend-swatch" style="background:rgba(251,146,60,0.3);border-color:#fb923c;"></div><span>Message Bus (Orange)</span></div>
  <div class="legend-item"><div class="legend-swatch" style="background:rgba(120,53,15,0.3);border-color:#fbbf24;"></div><span>Cloud / Infra (Amber)</span></div>
  <div class="legend-item"><div class="legend-swatch" style="background:rgba(136,19,55,0.4);border-color:#fb7185;"></div><span>Security Group (Rose)</span></div>
</div>

</div>
</body>
</html>
